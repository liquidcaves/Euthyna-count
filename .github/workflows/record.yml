# Once a day, fetch Euthyna's published count record, check it, and commit it here.
#
# This repository is the independent copy: GitHub timestamps every commit and keeps every version,
# so Euthyna cannot later change what was published on any day without it showing here.
name: Record Euthyna's count

on:
  schedule:
    - cron: '30 15 * * *' # 01:30 Sydney standard time, after the day's checkpoints are taken
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch the record
        id: fetch
        run: |
          # While euthyna.com.au is closed, the address answers 307 with a one-byte body of "/",
          # and the day's record is not published at all. That is a normal night, not a failure.
          #
          # ⚠️ A REDIRECT IS NOT AN ERROR TO curl. `-f` fails only on 400 and above, so the
          # 2026-09-22 fix — which assumed a closed site would make curl fail — saved the body "/"
          # as the record and the checker then died on "Unexpected token '/'", three nights
          # running. The status code and the content are BOTH checked here, because either alone
          # has now been observed passing while the file was rubbish.
          #
          # `exit 0` ends THIS step only; the two below run only when a record really arrived.
          code=$(curl -sS --max-redirs 0 -o new.json -w '%{http_code}' \
            https://euthyna.com.au/tally/checkpoints.json) || code=000
          if [ "$code" != "200" ]; then
            echo "::notice::No record published today — the site answered $code. Nothing saved."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            rm -f new.json
            exit 0
          fi
          if ! node -e 'JSON.parse(require("fs").readFileSync("new.json","utf8"))' 2>/dev/null; then
            echo "::notice::The address answered 200 with something that is not the record. Nothing saved."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            rm -f new.json
            exit 0
          fi
          mv new.json checkpoints.json
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      - name: Check it
        if: steps.fetch.outputs.fetched == 'true'
        run: node verify.mjs checkpoints.json
      - name: Keep it
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          git config user.name 'euthyna-record'
          git config user.email 'help@euthyna.com.au'
          git add checkpoints.json
          git diff --cached --quiet || git commit -m "Record as published $(date -u +%Y-%m-%d)"
          git push
